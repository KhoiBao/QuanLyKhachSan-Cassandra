<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách sạn - Quản lý khách sạn</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="layout">
    <th:block th:replace="~{fragments :: sidebar('hotels')}"></th:block>

    <main class="main">
        <th:block th:replace="~{fragments :: header('Quản lý khách sạn', 'Quản lý thông tin các khách sạn trong hệ thống')}"></th:block>
        <div th:replace="~{fragments :: alerts}"></div>

        <section class="card bookings-card">
            <div class="card-header">
                <div>
                    <h3>Danh sách khách sạn</h3>
                    <p th:text="${#lists.size(hotels)} + ' khách sạn đang được quản lý'"></p>
                </div>
                <form th:action="@{/hotels}" method="get" class="filter-form">
                    <input type="text" name="keyword" th:value="${fKeyword}" placeholder="Tìm khách sạn..." class="search-box">
                    <select name="city" class="filter-select">
                        <option value="">Tất cả thành phố</option>
                        <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"
                                th:selected="${c == fCity}">--</option>
                    </select>
                    <select name="status" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                                th:selected="${fStatus != null && s == fStatus}">--</option>
                    </select>
                    <button type="submit" class="btn btn-ghost">Lọc</button>
                    <button type="button" class="btn" onclick="toggleForm('hotelForm')">+ Thêm khách sạn</button>
                </form>
            </div>

            <!-- FORM THEM / SUA -->
            <form th:action="@{/hotels}" th:object="${editing}" method="post"
                  class="entity-form" id="hotelForm"
                  th:style="${editing.hotelId != null} ? 'display:block' : 'display:none'">
                <h4 th:text="${editing.hotelId != null} ? 'Sửa khách sạn ' + ${editing.hotelId} : 'Thêm khách sạn mới'">Thêm khách sạn</h4>
                <input type="hidden" name="hotelId" th:value="${editing.hotelId}">
                <div class="form-grid">
                    <label>Tên khách sạn <input type="text" th:field="*{hotelName}" required></label>
                    <label>Thành phố <input type="text" th:field="*{city}" required></label>
                    <label class="span-2">Địa chỉ <input type="text" th:field="*{address}" required></label>
                    <label>Số sao (1-5) <input type="number" min="1" max="5" th:field="*{starRating}" required></label>
                    <label>Điện thoại <input type="text" th:field="*{phone}"></label>
                    <label>Email <input type="email" th:field="*{email}"></label>
                    <label>Trạng thái
                        <select th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}">--</option>
                        </select>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn"
                            th:text="${editing.hotelId != null} ? 'Cập nhật' : 'Thêm mới'">Lưu</button>
                    <a th:href="@{/hotels}" class="btn btn-ghost">Hủy</a>
                </div>
            </form>

            <!-- TABLE -->
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Mã khách sạn</th>
                        <th>Tên khách sạn</th>
                        <th>Thành phố</th>
                        <th>Địa chỉ</th>
                        <th>Số sao</th>
                        <th>Số phòng</th>
                        <th>Trạng thái</th>
                        <th th:if="${canManageHotels}">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${pageItems}">
                        <td><strong th:text="'#' + ${h.hotelId}">#KS000</strong></td>
                        <td th:text="${h.hotelName}">--</td>
                        <td th:text="${h.city}">--</td>
                        <td th:text="${h.address}">--</td>
                        <td th:text="${h.starText}">★★★</td>
                        <td th:text="${h.totalRooms}">0</td>
                        <td>
                            <span class="badge" th:classappend="${h.status.cssClass}"
                                  th:text="${h.status.label}">--</span>
                        </td>
                        <td th:if="${canManageHotels}">
                            <a class="btn-link" th:href="@{/hotels(edit=${h.hotelId})}">Sửa</a>
                            <form th:action="@{/hotels/{id}/delete(id=${h.hotelId})}" method="post"
                                  class="inline-form" th:if="${canDelete}"
                                  th:data-confirm="${'Xóa khách sạn ' + h.hotelId + '?'}">
                                <button type="submit" class="btn-link btn-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pageItems)}">
                        <td colspan="8" class="empty-state">Không có khách sạn nào khớp bộ lọc.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments :: pagination(${currentPage}, ${totalPages})}"></div>
        </section>
    </main>
</div>
<script th:inline="javascript">
    function toggleForm(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
    // Xac nhan truoc khi submit cac form co data-confirm (cho phep JS chuan Thymeleaf 3.1)
    document.addEventListener('submit', function (e) {
        const msg = e.target.getAttribute('data-confirm');
        if (msg && !window.confirm(msg)) {
            e.preventDefault();
        }
    }, true);
</script>
</body>
</html>
