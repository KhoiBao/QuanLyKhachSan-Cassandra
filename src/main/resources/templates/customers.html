<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng - Quản lý khách sạn</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="layout">
    <th:block th:replace="~{fragments :: sidebar('customers')}"></th:block>

    <main class="main">
        <th:block th:replace="~{fragments :: header('Quản lý khách hàng', 'Quản lý thông tin khách hàng của khách sạn')}"></th:block>
        <div th:replace="~{fragments :: alerts}"></div>

        <section class="card bookings-card">
            <div class="card-header">
                <div>
                    <h3>Danh sách khách hàng</h3>
                    <p th:text="${#lists.size(guests)} + ' khách hàng đã đăng ký'"></p>
                </div>
                <form th:action="@{/customers}" method="get" class="filter-form">
                    <input type="text" name="keyword" th:value="${fKeyword}"
                           placeholder="Tìm tên / SĐT / CCCD..." class="search-box">
                    <button type="submit" class="btn btn-ghost">Tìm</button>
                    <button type="button" class="btn" onclick="toggleForm('guestForm')">+ Thêm khách hàng</button>
                </form>
            </div>

            <!-- FORM THEM / SUA -->
            <form th:action="@{/customers}" th:object="${editing}" method="post"
                  class="entity-form" id="guestForm"
                  th:style="${editing.guestId != null} ? 'display:block' : 'display:none'">
                <h4 th:text="${editing.guestId != null} ? 'Sửa khách hàng ' + ${editing.displayName} : 'Thêm khách hàng mới'">Thêm khách hàng</h4>
                <input type="hidden" name="guestId" th:value="${editing.guestId}">
                <div class="form-grid">
                    <label>Họ và tên <input type="text" th:field="*{fullName}" required></label>
                    <label>Số điện thoại <input type="text" th:field="*{phone}" required></label>
                    <label>Email <input type="email" th:field="*{email}"></label>
                    <label>CCCD (12 số) <input type="text" th:field="*{cccd}"></label>
                    <label class="span-2">Địa chỉ <input type="text" th:field="*{address}"></label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn"
                            th:text="${editing.guestId != null} ? 'Cập nhật' : 'Thêm mới'">Lưu</button>
                    <a th:href="@{/customers}" class="btn btn-ghost">Hủy</a>
                </div>
            </form>

            <!-- TABLE -->
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Mã khách hàng</th>
                        <th>Họ và tên</th>
                        <th>Số điện thoại</th>
                        <th>Email</th>
                        <th>CCCD</th>
                        <th>Địa chỉ</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="g : ${pageItems}">
                        <td><strong th:text="${g.guestId}">KH000</strong></td>
                        <td th:text="${g.fullName}">--</td>
                        <td th:text="${g.phone}">--</td>
                        <td th:text="${g.email}">--</td>
                        <td th:text="${g.cccd}">--</td>
                        <td th:text="${g.address}">--</td>
                        <td>
                            <a class="btn-link" th:href="@{/customers(edit=${g.guestId})}">Sửa</a>
                            <form th:action="@{/customers/{id}/delete(id=${g.guestId})}" method="post"
                                  class="inline-form" th:if="${canDelete}"
                                  th:data-confirm="${'Xóa khách hàng ' + g.displayName + '?'}">
                                <button type="submit" class="btn-link btn-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pageItems)}">
                        <td colspan="7" class="empty-state">Không có khách hàng nào khớp từ khóa.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments :: pagination(${currentPage}, ${totalPages})}"></div>
        </section>
    </main>
</div>
<script th:inline="javascript">
    function toggleForm(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
    // Xac nhan truoc khi submit cac form co data-confirm (cho phep JS chuan Thymeleaf 3.1)
    document.addEventListener('submit', function (e) {
        const msg = e.target.getAttribute('data-confirm');
        if (msg && !window.confirm(msg)) {
            e.preventDefault();
        }
    }, true);
</script>
</body>
</html>
