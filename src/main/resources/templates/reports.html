<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo doanh thu - Quản lý khách sạn</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="layout">
    <th:block th:replace="~{fragments :: sidebar('reports')}"></th:block>

    <main class="main">
        <th:block th:replace="~{fragments :: header('Báo cáo doanh thu', 'Theo dõi tình hình doanh thu của các khách sạn (chỉ ADMIN / MANAGER)')}"></th:block>
        <div th:replace="~{fragments :: alerts}"></div>

        <!-- STATS -->
        <section class="statistics">
            <div class="stat-card">
                <div class="stat-icon available-icon">💰</div>
                <div>
                    <span>Doanh thu hôm nay</span>
                    <h2 th:text="${#numbers.formatDecimal(revenueToday, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon booking-icon">📈</div>
                <div>
                    <span>Doanh thu tháng này</span>
                    <h2 th:text="${#numbers.formatDecimal(revenueThisMonth, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon hotel-icon">🧾</div>
                <div>
                    <span>Hóa đơn đã thanh toán</span>
                    <h2 th:text="${paidInvoiceCount}">0</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon room-icon">Σ</div>
                <div>
                    <span>Tổng doanh thu</span>
                    <h2 th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</h2>
                </div>
            </div>
        </section>

        <!-- CHART THEO THANG -->
        <section class="card bookings-card" style="margin-bottom:24px">
            <div class="card-header">
                <div>
                    <h3>Doanh thu 6 tháng gần nhất</h3>
                    <p>Tính trên các hóa đơn đã thanh toán</p>
                </div>
            </div>
            <div class="chart">
                <div class="chart-y">
                    <span th:text="${#numbers.formatDecimal(maxRevenue, 1, 'COMMA', 0, 'POINT')}">0</span>
                    <span th:text="${#numbers.formatDecimal(maxRevenue / 2, 1, 'COMMA', 0, 'POINT')}">0</span>
                    <span>0</span>
                </div>
                <div class="bars">
                    <div class="bar-column" th:each="m : ${revenueByMonth}">
                        <div class="bar"
                             th:style="'height:' + ${maxRevenue.signum() > 0 ? (m.revenue.longValueExact() * 100 / maxRevenue.longValueExact()) : 0} + '%'"
                             th:title="${#numbers.formatDecimal(m.revenue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></div>
                        <span th:text="${m.label}">T0</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- BANG THEO KHACH SAN -->
        <section class="card bookings-card">
            <div class="card-header">
                <div>
                    <h3>Doanh thu theo khách sạn</h3>
                    <p th:text="${#lists.size(revenueByHotel)} + ' khách sạn có doanh thu'"></p>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Mã KS</th>
                        <th>Khách sạn</th>
                        <th>Số hóa đơn</th>
                        <th>Doanh thu</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${revenueByHotel}">
                        <td><strong th:text="${r.hotelId}">KS000</strong></td>
                        <td th:text="${r.hotelName}">--</td>
                        <td th:text="${r.invoiceCount}">0</td>
                        <td>
                            <strong th:text="${#numbers.formatDecimal(r.revenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</strong>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(revenueByHotel)}">
                        <td colspan="4" class="empty-state">Chưa có doanh thu nào được ghi nhận.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
