<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng - Quản lý khách sạn</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
<div class="layout">
    <th:block th:replace="~{fragments :: sidebar('rooms')}"></th:block>

    <main class="main">
        <th:block th:replace="~{fragments :: header('Quản lý phòng', 'Quản lý thông tin và trạng thái các phòng')}"></th:block>
        <div th:replace="~{fragments :: alerts}"></div>

        <section class="card bookings-card">
            <div class="card-header">
                <div>
                    <h3>Danh sách phòng</h3>
                    <p th:text="${#lists.size(rooms)} + ' phòng của các khách sạn'"></p>
                </div>
                <form th:action="@{/rooms}" method="get" class="filter-form">
                    <select name="hotelId" class="filter-select">
                        <option value="">Tất cả khách sạn</option>
                        <option th:each="h : ${hotels}" th:value="${h.hotelId}"
                                th:text="${h.displayName}" th:selected="${h.hotelId == fHotelId}">--</option>
                    </select>
                    <select name="roomType" class="filter-select">
                        <option value="">Tất cả loại phòng</option>
                        <option th:each="t : ${roomTypes}" th:value="${t}" th:text="${t}"
                                th:selected="${t == fRoomType}">--</option>
                    </select>
                    <select name="status" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                                th:selected="${fStatus != null && s == fStatus}">--</option>
                    </select>
                    <button type="submit" class="btn btn-ghost">Lọc</button>
                    <button type="button" class="btn" onclick="toggleForm('roomForm')">+ Thêm phòng</button>
                </form>
            </div>

            <!-- FORM THEM / SUA -->
            <form th:action="@{/rooms}" th:object="${editing}" method="post"
                  class="entity-form" id="roomForm"
                  th:style="${editing.roomNumber != null} ? 'display:block' : 'display:none'">
                <h4 th:text="${editing.roomNumber != null} ? 'Sửa phòng ' + ${editing.displayCode} : 'Thêm phòng mới'">Thêm phòng</h4>
                <input type="hidden" name="originalKey" th:value="${editing.displayCode}">
                <div class="form-grid">
                    <label>Khách sạn
                        <select th:field="*{hotelId}" required>
                            <option value="">-- Chọn khách sạn --</option>
                            <option th:each="h : ${hotels}" th:value="${h.hotelId}"
                                    th:text="${h.displayName}">--</option>
                        </select>
                    </label>
                    <label>Số phòng <input type="number" min="1" th:field="*{roomNumber}" required></label>
                    <label>Loại phòng
                        <select th:field="*{roomType}" required>
                            <option th:each="t : ${roomTypes}" th:value="${t}" th:text="${t}">--</option>
                        </select>
                    </label>
                    <label>Giá / đêm (VND) <input type="text" name="price" th:value="${editing.pricePerNight}" required></label>
                    <label>Sức chứa <input type="number" min="1" th:field="*{capacity}"></label>
                    <label>Tầng <input type="number" min="1" th:field="*{floor}"></label>
                    <label>Trạng thái
                        <select th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}">--</option>
                        </select>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn"
                            th:text="${editing.roomNumber != null} ? 'Cập nhật' : 'Thêm mới'">Lưu</button>
                    <a th:href="@{/rooms}" class="btn btn-ghost">Hủy</a>
                </div>
            </form>

            <!-- TABLE -->
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Mã phòng</th>
                        <th>Khách sạn</th>
                        <th>Loại phòng</th>
                        <th>Giá / đêm</th>
                        <th>Sức chứa</th>
                        <th>Tầng</th>
                        <th>Trạng thái</th>
                        <th th:if="${canManageHotels}">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${pageItems}">
                        <td><strong th:text="${r.displayCode}">KS000-000</strong></td>
                        <td th:text="${r.hotelName}">--</td>
                        <td th:text="${r.roomType}">--</td>
                        <td th:text="${#numbers.formatDecimal(r.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                        <td th:text="${r.capacity}">0</td>
                        <td th:text="${r.floor}">0</td>
                        <td>
                            <span class="badge" th:classappend="${r.status.cssClass}"
                                  th:text="${r.status.label}">--</span>
                        </td>
                        <td th:if="${canManageHotels}">
                            <a class="btn-link" th:href="@{/rooms(edit=${r.displayCode})}">Sửa</a>
                            <form th:action="@{/rooms/delete}" method="post" class="inline-form"
                                  th:if="${canDelete}"
                                  th:data-confirm="${'Xóa phòng ' + r.displayCode + '?'}">
                                <input type="hidden" name="hotelId" th:value="${r.hotelId}">
                                <input type="hidden" name="roomNumber" th:value="${r.roomNumber}">
                                <button type="submit" class="btn-link btn-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pageItems)}">
                        <td colspan="8" class="empty-state">Không có phòng nào khớp bộ lọc.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments :: pagination(${currentPage}, ${totalPages})}"></div>
        </section>
    </main>
</div>
<script th:inline="javascript">
    function toggleForm(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
    // Xac nhan truoc khi submit cac form co data-confirm (cho phep JS chuan Thymeleaf 3.1)
    document.addEventListener('submit', function (e) {
        const msg = e.target.getAttribute('data-confirm');
        if (msg && !window.confirm(msg)) {
            e.preventDefault();
        }
    }, true);
</script>
</body>
</html>
