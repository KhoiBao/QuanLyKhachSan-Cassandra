# =========================================================================
# PROFILE: cassandra  (Spring Data Cassandra -> Astra DB hoac node local)
# Bat bang: mvnw spring-boot:run "-Dspring-boot.run.profiles=cassandra"
# hoac:     java -jar app.jar --spring.profiles.active=cassandra
# =========================================================================
app.seed-on-startup=${APP_SEED:true}

# ---------- Cach 1: Cassandra / DSE chay local (docker hoac cai truc tiep) ----
spring.cassandra.contact-points=${CASSANDRA_HOST:127.0.0.1}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DC:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:qlkhachsan}

# ---------- Cach 2: Astra DB (cloud) - KHONG commit secret vao git ----------
# Dat cac bien moi truong sau truoc khi chay:
#   ASTRA_BUNDLE=C:\secure-connect-qlkhachsan.zip
#   ASTRA_CLIENT_ID=xxxxxxxx
#   ASTRA_CLIENT_SECRET=xxxxxxxx
#   ASTRA_KEYSPACE=qlkhachsan
#   CASSANDRA_LOCAL_DC=eu-west-1     (lay tu bundle, thuong la region cua DB)
spring.cassandra.ssl-bundle=${ASTRA_BUNDLE:}
spring.cassandra.username=${ASTRA_CLIENT_ID:}
spring.cassandra.password=${ASTRA_CLIENT_SECRET:}

# Tu dong tao keyspace + bang theo annotation @Table/@PrimaryKeyClass
# (xem them src/main/resources/cql/schema.cql de tao bang bo sung)
spring.cassandra.schema-action=create-if-not-found
spring.cassandra.request.timeout=20s
spring.cassandra.connection.connect-timeout=20s
spring.cassandra.connection.init-query-timeout=20s
spring.cassandra.controlconnection.timeout=20s
logging.level.org.springframework.data.cassandra=INFO