spring.application.name=qlkhachsan

# =========================================================================
# CHE DO LUU TRU (chon bang profile)
#   - memory    : luu trong bo nho, co du lieu mau -> chay/demo/test ngay,
#                 KHONG can Cassandra. Day la mac dinh.
#   - cassandra : dung Spring Data Cassandra + Astra DB / node Cassandra that.
#                 Bat bang: --spring.profiles.active=cassandra
# =========================================================================
spring.profiles.active=memory

# ===== Web / View =====
server.port=8080
spring.mvc.hiddenmethod.filter.enabled=true
spring.web.locale=vi
spring.web.locale-resolver=fixed
spring.messages.basename=messages,i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
server.error.whitelabel.enabled=false

# ===== Jackson (Boot 4 dung Jackson 3) =====
# Luu y: Jackson 3 da chuyen cac feature ngay/gio sang DateTimeFeature va mac
# dinh ghi ISO-8601 (khong con SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===== Nghiep vu (co the override trong tung profile) =====
app.business.vat-rate=0.10
app.business.default-page-size=10
app.business.max-page-size=100
app.business.seed-on-startup=true

# ===== Logging =====
logging.level.root=INFO
logging.level.com.qlkhachsan=INFO
logging.level.org.springframework.data.cassandra.core.cql=INFO
